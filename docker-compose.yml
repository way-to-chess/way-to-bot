services:
  server:
    container_name: wtb_server
    image: traktirwik/way_to_bot:server_${TAG:?err}_${ENV:?err}
    ports:
      - "3000:3000"
    env_file:
      - ./packages/server/.env
    volumes:
      - ./packages/server/.env:/app/packages/server/.env
      - ./docker_data/uploads:/app/docker_data/uploads
      - ./docker_data/api_logs:/app/docker_data/api_logs
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      sh -c "
        cd packages/server &&
        sh bin/typeorm/run-migration.sh && 
        pnpm run production
      "

  web:
    container_name: wtb_web
    image: traktirwik/way_to_bot:web_${TAG:?err}_${ENV:?err}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/service_unavailable:/usr/share/nginx/html/service_unavailable:ro
      - ./docker_data/uploads:/usr/share/nginx/html/uploads
      - ./docker_data/certbot/www/:/var/www/certbot/:ro
      - ./docker_data/certbot/conf/:/etc/nginx/ssl/:ro
      - ./docker_data/nginx/logs:/var/log/nginx
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      sh -c "
        ( last=;
          while true; do
            cur=\$(readlink -f /etc/nginx/ssl/live/waytochess.site/fullchain.pem 2>/dev/null || true);
            if [ -n \"\$cur\" ] && [ \"\$cur\" != \"\$last\" ]; then
              if [ -n \"\$last\" ]; then nginx -s reload || true; fi;
              last=\$cur;
            fi;
            sleep 60;
          done ) &
        ( while true; do
            sleep \$(( (\$(date -d '03:00 tomorrow' +%s) - \$(date +%s)) % 86400 ));
            nginx -s reload;
          done ) &
        nginx -g 'daemon off;'
      "

  nginx-log-cleaner:
    container_name: wtb_nginx_log_cleaner
    image: alpine:3
    restart: unless-stopped
    environment:
      - LOG_RETENTION_DAYS=3
      - LOG_CLEAN_INTERVAL_SEC=21600
    volumes:
      - ./docker_data/nginx/logs:/var/log/nginx
    command: >
      sh -c "while true; do \
        if [ -d /var/log/nginx ]; then \
          find /var/log/nginx -type f -mtime +${LOG_RETENTION_DAYS:-7} -print -delete; \
        fi; \
        sleep ${LOG_CLEAN_INTERVAL_SEC:-21600}; \
      done"    

  certbot:
    container_name: wtb_certbot
    image: certbot/certbot:latest
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./docker_data/certbot/www/:/var/www/certbot/:rw
      - ./docker_data/certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          if ! certbot certificates --cert-name waytochess.site 2>/dev/null | grep -q 'api.waytochess.site' || ! certbot certificates --cert-name waytochess.site 2>/dev/null | grep -q 'tg.waytochess.site' || ! certbot certificates --cert-name waytochess.site 2>/dev/null | grep -q 'admin.waytochess.site'; then
            if ! certbot certonly --webroot -w /var/www/certbot --cert-name waytochess.site -d waytochess.site -d api.waytochess.site -d tg.waytochess.site -d admin.waytochess.site --expand --email ignatmustafin77@gmail.com --agree-tos --non-interactive; then
              echo "certbot: failed to issue certificate"
              sleep 900
              continue
            fi
          fi
          certbot renew --quiet || echo "certbot: renew failed"
          sleep 43200
        done
    restart: unless-stopped
